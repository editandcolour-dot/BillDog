# Nixpacks config for Railway deployment
# Required for Playwright/Chromium browser automation (autofetch scrapers)

[phases.setup]
# System packages required by Chromium headless
aptPkgs = [
  "libnss3",
  "libnspr4",
  "libatk1.0-0",
  "libatk-bridge2.0-0",
  "libcups2",
  "libdrm2",
  "libxkbcommon0",
  "libxcomposite1",
  "libxdamage1",
  "libxrandr2",
  "libgbm1",
  "libpango-1.0-0",
  "libcairo2",
  "libasound2",
  "libatspi2.0-0",
  "libxshmfence1",
]

[phases.build]
# Install Chromium binary after npm install, before next build
cmds = [
  "npx playwright install chromium",
  "npm run build",
]
