# Nixpacks config for Railway deployment
# Required for Playwright/Chromium browser automation (autofetch scrapers)
#
# Strategy: Use `playwright install --with-deps chromium` which auto-detects
# the OS and installs the correct system packages (handles Ubuntu 24.04+
# package renames like libasound2 → libasound2t64 automatically).

[phases.build]
cmds = [
  "npx playwright install --with-deps chromium",
  "npm run build",
]
